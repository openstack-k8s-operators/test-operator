# This patch inject custom ENV settings to the manager container
# Used to set our default image locations
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
spec:
  template:
    spec:
      containers:
      - name: manager
        env:
        - name: RELATED_IMAGE_TEST_TEMPEST_IMAGE_URL_DEFAULT
          value: quay.io/openstack-s2i-containers/openstack-tempest:master-latest
        - name: RELATED_IMAGE_TEST_TOBIKO_IMAGE_URL_DEFAULT
          value: quay.io/openstack-s2i-containers/openstack-tobiko:master-latest
        - name: RELATED_IMAGE_TEST_ANSIBLETEST_IMAGE_URL_DEFAULT
          value: quay.io/openstack-s2i-containers/openstack-ansible-test:master-latest
        - name: RELATED_IMAGE_TEST_HORIZONTEST_IMAGE_URL_DEFAULT
          value: quay.io/openstack-s2i-containers/openstack-horizontest:master-latest
