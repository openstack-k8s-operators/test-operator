---
# project template to be used locally for operator testing
- project-template:
    name: test-operator-s2i-testing
    github-check:
      jobs:
        - test-operator-s2i-content-provider:
            voting: false
        - test-operator-kuttl-s2i:
            voting: false
            dependencies:
              - openstack-k8s-operators-content-provider
              - test-operator-s2i-content-provider
        - test-operator-s2i-test:
            voting: false
            dependencies:
              - openstack-k8s-operators-content-provider
              - test-operator-s2i-content-provider

# project template to be used in the s2i repository
- project-template:
    name: test-operator-s2i-component-jobs
    github-check:
      jobs:
        - test-operator-s2i-test:
            vars:
              content_provider_registry_ip: "{{ s2i_content_provider_registry_ip }}"
            files:
              - ^containers/base/
              - ^containers/tempest/
            dependencies:
              - s2i-openstack-container-content-provider
              - s2i-openstack-container-consumer-smoke

- project:
    name: openstack-k8s-operators/test-operator
    templates:
      - test-operator-s2i-testing
    github-check:
      jobs:
        - openstack-k8s-operators-content-provider:
            vars:
              cifmw_install_yamls_sdk_version: v1.41.1
        - test-operator-kuttl:
            dependencies:
              - openstack-k8s-operators-content-provider
        - podified-multinode-edpm-deployment-crc-test-operator:
            dependencies:
              - openstack-k8s-operators-content-provider
